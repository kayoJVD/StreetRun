spring:
    application:
        name: street-race
    datasource:
        driver-class-name: org.postgresql.Driver
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

api:
    security:
        token:
            secret: ${JWT_SECRET:street-run-secret-dev}
